name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run smoke:version
      - run: npm pack

      - name: Checksums
        run: sha256sum debug-agent-*.tgz > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            debug-agent-*.tgz
            SHA256SUMS.txt
          generate_release_notes: true
